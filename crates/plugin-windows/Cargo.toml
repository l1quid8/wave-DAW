[package]
name = "wave-plugin-windows"
description = "WAVE: native top-level windows for VST3 plugin editors, pumped by the app's own UI-thread event loop."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
parking_lot.workspace = true
thiserror.workspace = true

# Raw Win32. See the crate docs for why this is not `tao`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# AppKit. tao (Tauri's event loop) already links these exact crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSObject", "NSString", "NSGeometry", "NSNotification", "NSRunLoop", "NSTimer", "NSDate", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics"] }
